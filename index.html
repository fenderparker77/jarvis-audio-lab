<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jarvis Audio Lab - Pro Edition</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <script type="module">
        import { SoundTouch, SimpleFilter } from 'https://cdn.jsdelivr.net/npm/soundtouchjs@0.1.30/+esm';
        window.JarvisSoundTouch = SoundTouch;
        window.JarvisSimpleFilter = SimpleFilter;
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-start p-4 md:p-8 font-sans">

    <div class="bg-slate-800 p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-lg border border-slate-700">
        <h1 class="text-2xl font-bold mb-2 text-center text-cyan-400 font-mono tracking-wider">JARVIS AUDIO LAB</h1>
        <p class="text-center text-slate-400 text-xs mb-6 font-mono">VERIFIED PRO MUSICIAN EDITION</p>
        
        <!-- กราฟิกคลื่นเสียง -->
        <div class="w-full bg-slate-900 rounded-xl mb-6 overflow-hidden border border-slate-700 h-24 relative">
            <canvas id="visualizer" class="w-full h-full"></canvas>
            <div id="noAudioText" class="absolute inset-0 flex items-center justify-center text-slate-600 text-sm font-medium">รอเลือกไฟล์เพลง...</div>
        </div>

        <!-- เลือกไฟล์เข้าคลัง -->
        <div class="mb-4">
            <label class="block text-sm font-medium mb-2 text-slate-300">เพิ่มไฟล์เพลงเข้าคลัง (เลือกได้หลายไฟล์)</label>
            <input type="file" id="audioFile" accept="audio/*" multiple class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-cyan-500 file:text-slate-900 hover:file:bg-cyan-400 cursor-pointer transition">
        </div>

        <!-- ชื่อเพลงปัจจุบัน -->
        <div class="text-center mb-4 text-sm font-semibold text-emerald-400 truncate h-6" id="currentTrackName"></div>

        <!-- แถบเวลา -->
        <div class="mb-6">
            <div class="flex justify-between text-xs text-slate-400 mb-2 font-mono">
                <span id="timeCurrent">0:00</span>
                <span id="timeTotal">0:00</span>
            </div>
            <input type="range" id="progressBar" min="0" max="100" value="0" step="0.1" class="w-full accent-cyan-400 cursor-pointer disabled:opacity-50" disabled>
        </div>

        <!-- ปุ่มควบคุมหลัก -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <button id="btnPlay" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-2 rounded-xl transition disabled:opacity-50 flex items-center justify-center gap-2" disabled>▶ เล่น</button>
            <button id="btnPause" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 px-2 rounded-xl transition disabled:opacity-50 flex items-center justify-center gap-2" disabled>⏸ พัก</button>
            <button id="btnStop" class="bg-rose-700 hover:bg-rose-600 text-white font-bold py-3 px-2 rounded-xl transition disabled:opacity-50 flex items-center justify-center gap-2" disabled>⏹ หยุด</button>
        </div>

        <!-- ควบคุม Tempo -->
        <div class="mb-4 bg-slate-700/30 p-4 rounded-xl">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium text-slate-300">Tempo (ความเร็ว)</span>
                <div class="flex items-center gap-2">
                    <button id="resetTempo" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-2 py-1 rounded border border-slate-600">Reset</button>
                    <span id="tempoVal" class="text-sm font-mono text-cyan-400 bg-slate-800 px-2 py-1 rounded">1.00x</span>
                </div>
            </div>
            <input type="range" id="sliderTempo" min="0.5" max="1.5" step="0.05" value="1.0" class="w-full accent-cyan-400">
        </div>

        <!-- ควบคุม Key -->
        <div class="mb-4 bg-slate-700/30 p-4 rounded-xl">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium text-slate-300">Key (คีย์ / Semitones)</span>
                <div class="flex items-center gap-2">
                    <button id="resetPitch" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-2 py-1 rounded border border-slate-600">Reset</button>
                    <span id="pitchVal" class="text-sm font-mono text-cyan-400 bg-slate-800 px-2 py-1 rounded">0</span>
                </div>
            </div>
            <input type="range" id="sliderPitch" min="-12" max="12" step="1" value="0" class="w-full accent-cyan-400">
        </div>

        <!-- โหมดตัดเสียงร้อง -->
        <button id="btnVocal" class="w-full bg-purple-700 hover:bg-purple-600 text-white font-bold py-3 px-4 rounded-xl mb-6 transition shadow-lg shadow-purple-900/50 flex justify-center items-center gap-2">
            🎤 เปิดโหมดตัดเสียงร้อง (Vocal Remover: OFF)
        </button>

        <!-- โหมด Panning L/R -->
        <div class="mb-6 bg-slate-700/30 p-4 rounded-xl border border-slate-600">
            <div class="flex justify-between mb-3">
                <span class="text-sm font-medium text-slate-300">Audio Panning (แยกไลน์ซ้าย-ขวา)</span>
                <span id="panVal" class="text-sm font-mono text-cyan-400 bg-slate-800 px-2 py-1 rounded">Center</span>
            </div>
            <div class="flex items-center gap-3 mb-4">
                <span class="text-xs font-bold text-slate-400">L</span>
                <input type="range" id="sliderPan" min="-1" max="1" step="0.05" value="0" class="w-full accent-cyan-400">
                <span class="text-xs font-bold text-slate-400">R</span>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <button id="btnPanLeft" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs py-2 rounded-lg transition border border-slate-600">Hard L</button>
                <button id="btnPanCenter" class="bg-cyan-900 hover:bg-cyan-800 text-cyan-100 text-xs py-2 rounded-lg transition border border-cyan-700 font-semibold">Center</button>
                <button id="btnPanRight" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs py-2 rounded-lg transition border border-slate-600">Hard R</button>
            </div>
        </div>

        <!-- คลังเพลง -->
        <div class="bg-slate-900 rounded-xl border border-slate-700 p-4 h-48 overflow-y-auto">
            <h3 class="text-xs font-bold text-cyan-500 mb-3 tracking-widest uppercase">SONG LIBRARY PLAYLIST</h3>
            <ul id="playlistUI" class="space-y-2">
                <li class="text-slate-500 text-sm text-center py-4 italic">คลังเพลงว่างเปล่า...</li>
            </ul>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.error('PWA Error:', err));
        }

        let audioCtx, soundTouch, filter, scriptNode, pannerNode, analyserNode, audioBuffer;
        let globalPosition = 0; 
        let isPlaying = false;
        let animationId;
        let isVocalRemoverOn = false;
        let playlist = [];
        let currentTrackIndex = -1;

        const ui = {
            file: document.getElementById('audioFile'),
            play: document.getElementById('btnPlay'),
            pause: document.getElementById('btnPause'),
            stop: document.getElementById('btnStop'),
            vocal: document.getElementById('btnVocal'),
            tempo: document.getElementById('sliderTempo'),
            pitch: document.getElementById('sliderPitch'),
            tempoVal: document.getElementById('tempoVal'),
            pitchVal: document.getElementById('pitchVal'),
            resetTempo: document.getElementById('resetTempo'),
            resetPitch: document.getElementById('resetPitch'),
            progress: document.getElementById('progressBar'),
            timeCurr: document.getElementById('timeCurrent'),
            timeTot: document.getElementById('timeTotal'),
            canvas: document.getElementById('visualizer'),
            noAudio: document.getElementById('noAudioText'),
            playlistUI: document.getElementById('playlistUI'),
            trackName: document.getElementById('currentTrackName'),
            pan: document.getElementById('sliderPan'),
            panVal: document.getElementById('panVal'),
            btnPanLeft: document.getElementById('btnPanLeft'),
            btnPanCenter: document.getElementById('btnPanCenter'),
            btnPanRight: document.getElementById('btnPanRight')
        };
        const canvasCtx = ui.canvas.getContext('2d');

        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        ui.file.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            files.forEach(file => playlist.push(file));
            renderPlaylist();
            
            if (currentTrackIndex === -1) {
                loadTrack(playlist.length - files.length);
            }
        });

        function renderPlaylist() {
            ui.playlistUI.innerHTML = '';
            playlist.forEach((file, index) => {
                const li = document.createElement('li');
                li.className = `text-sm p-2 rounded cursor-pointer transition ${index === currentTrackIndex ? 'bg-cyan-900 text-cyan-300 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`;
                li.innerText = `${index + 1}. ${file.name}`;
                li.onclick = () => loadTrack(index);
                ui.playlistUI.appendChild(li);
            });
        }

        async function loadTrack(index) {
            if (index < 0 || index >= playlist.length) return;
            
            hardStopAudio(); 
            currentTrackIndex = index;
            renderPlaylist();
            
            const file = playlist[index];
            ui.trackName.innerText = `🎵 ${file.name}`;
            ui.noAudio.innerText = "กำลังเตรียมไฟล์... (Decoding)";
            ui.noAudio.style.display = "flex";

            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const arrayBuffer = await file.arrayBuffer();
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                
                ui.timeTot.innerText = formatTime(audioBuffer.duration);
                ui.timeCurr.innerText = "0:00";
                ui.play.disabled = false;
                ui.stop.disabled = false;
                ui.progress.disabled = false;
                ui.noAudio.style.display = "none";
                
                globalPosition = 0;
                ui.progress.value = 0;
                soundTouch = null;
                filter = null;

            } catch (err) {
                console.error(err);
                alert("ไฟล์นี้เข้ารหัสไม่รองรับ หรือไฟล์เสีย กรุณาลองไฟล์อื่นครับ");
                ui.noAudio.innerText = "ไฟล์มีปัญหา";
            }
        }

        async function playAudio() {
            if (!audioBuffer || isPlaying) return;
            
            try {
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                const ST = window.JarvisSoundTouch;
                const SF = window.JarvisSimpleFilter;

                if (!ST || !SF) {
                    alert("ระบบประมวลผลเสียงยังโหลดไม่เสร็จ กรุณารอสักครู่แล้วลองใหม่ครับ");
                    return;
                }

                if (!soundTouch) {
                    soundTouch = new ST(audioCtx.sampleRate);
                }
                
                soundTouch.tempo = parseFloat(ui.tempo.value);
                const semis = parseInt(ui.pitch.value);
                soundTouch.pitch = Math.pow(2, semis / 12);

                const source = {
                    extract: function (target, numFrames, position) {
                        const l = audioBuffer.getChannelData(0);
                        const r = audioBuffer.numberOfChannels > 1 ? audioBuffer.getChannelData(1) : l;
                        for (let i = 0; i < numFrames; i++) {
                            if (position + i < audioBuffer.length) {
                                target[i * 2] = l[position + i];
                                target[i * 2 + 1] = r[position + i];
                            } else {
                                target[i * 2] = 0;
                                target[i * 2 + 1] = 0;
                            }
                        }
                        return Math.min(numFrames, audioBuffer.length - position);
                    }
                };

                filter = new SF(source, soundTouch);
                // ซิงค์ตำแหน่งเริ่มต้นให้ตรงกับจุดที่ Pause หรือ Seek ไว้เสมอ
                filter.sourcePosition = globalPosition;

                scriptNode = audioCtx.createScriptProcessor(4096, 0, 2);
                scriptNode.onaudioprocess = function (e) {
                    if (!isPlaying) return;
                    
                    const outL = e.outputBuffer.getChannelData(0);
                    const outR = e.outputBuffer.getChannelData(1);
                    const samples = new Float32Array(outL.length * 2);
                    
                    const framesExtracted = filter.extract(samples, outL.length);
                    // อัปเดตตำแหน่งจริงจากตัวแปรภายในของ SimpleFilter
                    globalPosition = filter.sourcePosition;

                    for (let i = 0; i < outL.length; i++) {
                        let sL = samples[i * 2];
                        let sR = samples[i * 2 + 1];

                        if (isVocalRemoverOn) {
                            let vocalRemoved = (sL - sR) * 0.5;
                            outL[i] = vocalRemoved;
                            outR[i] = vocalRemoved;
                        } else {
                            outL[i] = sL;
                            outR[i] = sR;
                        }
                    }

                    const currentSec = globalPosition / audioBuffer.sampleRate;
                    const percent = (globalPosition / audioBuffer.length) * 100;
                    
                    if (Math.random() < 0.25) { 
                        requestAnimationFrame(() => {
                            ui.progress.value = Math.min(100, percent);
                            ui.timeCurr.innerText = formatTime(currentSec);
                        });
                    }

                    if (framesExtracted === 0 || globalPosition >= audioBuffer.length) {
                        hardStopAudio();
                        if (currentTrackIndex < playlist.length - 1) {
                            loadTrack(currentTrackIndex + 1).then(() => playAudio());
                        }
                    }
                };

                pannerNode = audioCtx.createStereoPanner();
                pannerNode.pan.value = parseFloat(ui.pan.value);

                analyserNode = audioCtx.createAnalyser();
                analyserNode.fftSize = 256;

                scriptNode.connect(pannerNode);
                pannerNode.connect(analyserNode);
                analyserNode.connect(audioCtx.destination);

                isPlaying = true;
                ui.play.disabled = true;
                ui.pause.disabled = false;
                
                drawVisualizer();
            } catch (err) {
                console.error("Play Error: ", err);
                alert("เกิดข้อผิดพลาดในการเล่นเสียง: " + err.message);
            }
        }

        function pauseAudio() {
            if (scriptNode) {
                scriptNode.disconnect();
                if(pannerNode) pannerNode.disconnect();
                if(analyserNode) analyserNode.disconnect();
                scriptNode = null;
            }
            isPlaying = false;
            ui.play.disabled = false;
            ui.pause.disabled = true;
            cancelAnimationFrame(animationId);
        }

        function hardStopAudio() {
            pauseAudio();
            globalPosition = 0;
            ui.progress.value = 0;
            ui.timeCurr.innerText = "0:00";
            soundTouch = null;
            filter = null;
        }

        ui.play.addEventListener('click', playAudio);
        ui.pause.addEventListener('click', pauseAudio);
        ui.stop.addEventListener('click', hardStopAudio);

        // เลื่อนแถบเวลา (Seek) แบบเรียลไทม์
        ui.progress.addEventListener('input', (e) => {
            if (audioBuffer) {
                const percent = parseFloat(e.target.value) / 100;
                const newPos = Math.floor(percent * audioBuffer.length);
                globalPosition = newPos;
                ui.timeCurr.innerText = formatTime(newPos / audioBuffer.sampleRate);
                if (filter) {
                    filter.sourcePosition = newPos;
                }
            }
        });

        // ควบคุมและรีเซ็ต Tempo
        function setTempo(val) {
            ui.tempo.value = val;
            ui.tempoVal.innerText = val.toFixed(2) + 'x';
            if (soundTouch) soundTouch.tempo = val;
        }
        ui.tempo.addEventListener('input', (e) => setTempo(parseFloat(e.target.value)));
        ui.resetTempo.addEventListener('click', () => setTempo(1.0));

        // ควบคุมและรีเซ็ต Key / Pitch
        function setPitch(val) {
            ui.pitch.value = val;
            ui.pitchVal.innerText = val > 0 ? '+' + val : val;
            if (soundTouch) {
                soundTouch.pitch = Math.pow(2, val / 12);
            }
        }
        ui.pitch.addEventListener('input', (e) => setPitch(parseInt(e.target.value)));
        ui.resetPitch.addEventListener('click', () => setPitch(0));

        // โหมดตัดเสียงร้อง
        ui.vocal.addEventListener('click', () => {
            isVocalRemoverOn = !isVocalRemoverOn;
            ui.vocal.innerText = isVocalRemoverOn ? '🎤 โหมดตัดเสียงร้อง (Vocal Remover: ON)' : '🎤 เปิดโหมดตัดเสียงร้อง (Vocal Remover: OFF)';
            if (isVocalRemoverOn) {
                ui.vocal.classList.replace('bg-purple-700', 'bg-pink-600');
                ui.vocal.classList.replace('hover:bg-purple-600', 'hover:bg-pink-500');
            } else {
                ui.vocal.classList.replace('bg-pink-600', 'bg-purple-700');
                ui.vocal.classList.replace('hover:bg-pink-500', 'hover:bg-purple-600');
            }
        });

        // ระบบ Panning
        function updatePanUI(val) {
            ui.pan.value = val;
            if (val === 0) ui.panVal.innerText = "Center";
            else if (val < 0) ui.panVal.innerText = `L ${Math.round(Math.abs(val) * 100)}%`;
            else ui.panVal.innerText = `R ${Math.round(val * 100)}%`;

            if (pannerNode) {
                pannerNode.pan.value = val;
            }

            [ui.btnPanLeft, ui.btnPanCenter, ui.btnPanRight].forEach(btn => {
                btn.classList.replace('bg-cyan-900', 'bg-slate-800');
                btn.classList.replace('text-cyan-100', 'text-slate-300');
                btn.classList.replace('border-cyan-700', 'border-slate-600');
                btn.classList.remove('font-semibold');
            });

            if (val === -1) {
                ui.btnPanLeft.classList.replace('bg-slate-800', 'bg-cyan-900');
                ui.btnPanLeft.classList.replace('text-slate-300', 'text-cyan-100');
                ui.btnPanLeft.classList.replace('border-slate-600', 'border-cyan-700');
                ui.btnPanLeft.classList.add('font-semibold');
            } else if (val === 1) {
                ui.btnPanRight.classList.replace('bg-slate-800', 'bg-cyan-900');
                ui.btnPanRight.classList.replace('text-slate-300', 'text-cyan-100');
                ui.btnPanRight.classList.replace('border-slate-600', 'border-cyan-700');
                ui.btnPanRight.classList.add('font-semibold');
            } else if (val === 0) {
                ui.btnPanCenter.classList.replace('bg-slate-800', 'bg-cyan-900');
                ui.btnPanCenter.classList.replace('text-slate-300', 'text-cyan-100');
                ui.btnPanCenter.classList.replace('border-slate-600', 'border-cyan-700');
                ui.btnPanCenter.classList.add('font-semibold');
            }
        }

        ui.pan.addEventListener('input', (e) => updatePanUI(parseFloat(e.target.value)));
        ui.btnPanLeft.addEventListener('click', () => updatePanUI(-1));
        ui.btnPanCenter.addEventListener('click', () => updatePanUI(0));
        ui.btnPanRight.addEventListener('click', () => updatePanUI(1));

        // Visualizer
        function drawVisualizer() {
            if (!analyserNode || !isPlaying) return;
            ui.canvas.width = ui.canvas.clientWidth;
            ui.canvas.height = ui.canvas.clientHeight;
            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            function draw() {
                if(!isPlaying) return;
                animationId = requestAnimationFrame(draw);
                analyserNode.getByteFrequencyData(dataArray);

                canvasCtx.fillStyle = '#0f172a';
                canvasCtx.fillRect(0, 0, ui.canvas.width, ui.canvas.height);

                const barWidth = (ui.canvas.width / bufferLength) * 2.5;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    let barHeight = dataArray[i] / 2;
                    canvasCtx.fillStyle = `rgb(34, 211, 238)`; 
                    canvasCtx.fillRect(x, ui.canvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }
            }
            draw();
        }
    </script>
</body>
</html>
