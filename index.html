<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Audio Lab - Musician Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/soundtouchjs@0.1.30/dist/soundtouch.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-700">
        <h1 class="text-2xl font-bold mb-2 text-center text-cyan-400 font-mono tracking-wider">JARVIS AUDIO LAB</h1>
        <p class="text-center text-slate-400 text-xs mb-6 font-mono">PRO MUSICIAN EDITION</p>
        
        <!-- ส่วนแสดงผลกราฟิกเสียง (Visualizer) -->
        <div class="w-full bg-slate-900 rounded-xl mb-6 overflow-hidden border border-slate-700 h-24 relative">
            <canvas id="visualizer" class="w-full h-full"></canvas>
            <div id="noAudioText" class="absolute inset-0 flex items-center justify-center text-slate-600 text-sm font-medium">Waiting for audio...</div>
        </div>

        <!-- 1. ส่วนเลือกไฟล์เพลง -->
        <div class="mb-6">
            <input type="file" id="audioFile" accept="audio/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-cyan-500 file:text-slate-900 hover:file:bg-cyan-400 cursor-pointer transition">
        </div>

        <!-- แถบเวลา (Progress Bar) -->
        <div class="mb-6">
            <div class="flex justify-between text-xs text-slate-400 mb-2 font-mono">
                <span id="timeCurrent">0:00</span>
                <span id="timeTotal">0:00</span>
            </div>
            <input type="range" id="progressBar" min="0" max="100" value="0" step="0.1" class="w-full accent-cyan-400 cursor-pointer disabled:opacity-50" disabled>
        </div>

        <!-- ตัวควบคุมสถานะการเล่น -->
        <div class="flex justify-center space-x-4 mb-6">
            <button id="btnPlay" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 px-8 rounded-full transition disabled:opacity-50 shadow-lg shadow-emerald-500/20" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            </button>
            <button id="btnPause" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 px-8 rounded-full transition disabled:opacity-50 shadow-lg shadow-amber-500/20" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            </button>
        </div>

        <!-- 2. ส่วนควบคุม Tempo -->
        <div class="mb-5 bg-slate-700/30 p-4 rounded-xl">
            <div class="flex justify-between mb-2">
                <span class="text-sm font-medium text-slate-300">Tempo (ความเร็ว)</span>
                <span id="tempoVal" class="text-sm font-mono text-cyan-400 bg-slate-800 px-2 py-1 rounded">1.00x</span>
            </div>
            <input type="range" id="sliderTempo" min="0.5" max="1.5" step="0.05" value="1.0" class="w-full accent-cyan-400">
        </div>

        <!-- 3. ส่วนควบคุม Key -->
        <div class="mb-5 bg-slate-700/30 p-4 rounded-xl">
            <div class="flex justify-between mb-2">
                <span class="text-sm font-medium text-slate-300">Key (คีย์ / Semitones)</span>
                <span id="pitchVal" class="text-sm font-mono text-cyan-400 bg-slate-800 px-2 py-1 rounded">0</span>
            </div>
            <input type="range" id="sliderPitch" min="-12" max="12" step="1" value="0" class="w-full accent-cyan-400">
        </div>

        <!-- 4. ส่วนควบคุม Output L/R -->
        <div class="mb-2">
            <span class="text-sm font-medium text-slate-400 block mb-3 text-center">Audio Output Channels</span>
            <div class="grid grid-cols-3 gap-2 bg-slate-900 p-1 rounded-lg border border-slate-700">
                <button id="modeNormal" class="btn-mode bg-cyan-600 text-white font-semibold py-2 rounded-md text-xs transition">Stereo</button>
                <button id="modeLeft" class="btn-mode text-slate-400 font-semibold py-2 rounded-md text-xs transition hover:text-white">Left Only</button>
                <button id="modeRight" class="btn-mode text-slate-400 font-semibold py-2 rounded-md text-xs transition hover:text-white">Right Only</button>
            </div>
        </div>
    </div>

    <script>
        let audioCtx, soundTouch, scriptNode, pannerNode, analyserNode, audioBuffer;
        
        // *แก้ไขบั๊ก Pause/Play: ย้าย position มาไว้เป็น Global Variable
        let globalPosition = 0; 
        let isPlaying = false;
        let animationId;

        // UI Elements
        const ui = {
            file: document.getElementById('audioFile'),
            play: document.getElementById('btnPlay'),
            pause: document.getElementById('btnPause'),
            tempo: document.getElementById('sliderTempo'),
            pitch: document.getElementById('sliderPitch'),
            tempoVal: document.getElementById('tempoVal'),
            pitchVal: document.getElementById('pitchVal'),
            progress: document.getElementById('progressBar'),
            timeCurr: document.getElementById('timeCurrent'),
            timeTot: document.getElementById('timeTotal'),
            modeNormal: document.getElementById('modeNormal'),
            modeLeft: document.getElementById('modeLeft'),
            modeRight: document.getElementById('modeRight'),
            canvas: document.getElementById('visualizer'),
            noAudio: document.getElementById('noAudioText')
        };
        const canvasCtx = ui.canvas.getContext('2d');

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        ui.file.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            stopAudio();
            globalPosition = 0; // รีเซ็ตเวลาเมื่อเลือกเพลงใหม่
            ui.progress.value = 0;
            ui.noAudio.innerText = "Loading & Decoding...";

            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const arrayBuffer = await file.arrayBuffer();
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                
                ui.timeTot.innerText = formatTime(audioBuffer.duration);
                ui.timeCurr.innerText = "0:00";
                ui.play.disabled = false;
                ui.progress.disabled = false;
                ui.noAudio.style.display = "none";
            } catch (err) {
                console.error(err);
                ui.noAudio.innerText = "Error loading file";
            }
        });

        function playAudio() {
            if (!audioBuffer || isPlaying) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const ST = window.soundtouch.SoundTouch;
            const SF = window.soundtouch.SimpleFilter;

            if (!soundTouch) {
                soundTouch = new ST(audioCtx.sampleRate);
                soundTouch.tempo = parseFloat(ui.tempo.value);
                soundTouch.pitchSemis = parseInt(ui.pitch.value);
            }

            const source = {
                extract: function (target, numFrames, position) {
                    const l = audioBuffer.getChannelData(0);
                    const r = audioBuffer.numberOfChannels > 1 ? audioBuffer.getChannelData(1) : l;
                    for (let i = 0; i < numFrames; i++) {
                        if (position + i < audioBuffer.length) {
                            target[i * 2] = l[position + i];
                            target[i * 2 + 1] = r[position + i];
                        } else {
                            target[i * 2] = 0;
                            target[i * 2 + 1] = 0;
                        }
                    }
                    return Math.min(numFrames, audioBuffer.length - position);
                }
            };

            const filter = new SF(source, soundTouch);

            scriptNode = audioCtx.createScriptProcessor(4096, 0, 2);
            scriptNode.onaudioprocess = function (e) {
                if (!isPlaying) return;
                
                const outL = e.outputBuffer.getChannelData(0);
                const outR = e.outputBuffer.getChannelData(1);
                const samples = new Float32Array(outL.length * 2);
                
                // ใช้ globalPosition เพื่อให้เล่นต่อจากจุดเดิมได้
                const framesExtracted = filter.extract(samples, outL.length, globalPosition);
                globalPosition += framesExtracted;

                for (let i = 0; i < outL.length; i++) {
                    outL[i] = samples[i * 2];
                    outR[i] = samples[i * 2 + 1];
                }

                // อัปเดต Progress Bar
                const currentSec = globalPosition / audioCtx.sampleRate;
                const percent = (globalPosition / audioBuffer.length) * 100;
                
                // อัปเดต UI (ลดภาระ CPU โดยไม่อัปเดตทุกเฟรมถ้าไม่จำเป็น)
                if (Math.random() < 0.2) { 
                    requestAnimationFrame(() => {
                        ui.progress.value = percent;
                        ui.timeCurr.innerText = formatTime(currentSec);
                    });
                }

                // วนลูปเมื่อจบเพลง (Loop feature)
                if (framesExtracted === 0 || globalPosition >= audioBuffer.length) {
                    globalPosition = 0;
                    if(soundTouch) soundTouch.clear(); // ล้างบัฟเฟอร์เสียงเก่า
                }
            };

            pannerNode = audioCtx.createStereoPanner();
            if (ui.modeLeft.classList.contains('bg-cyan-600')) pannerNode.pan.value = -1;
            else if (ui.modeRight.classList.contains('bg-cyan-600')) pannerNode.pan.value = 1;
            else pannerNode.pan.value = 0;

            // สร้าง Analyser สำหรับ Visualizer
            analyserNode = audioCtx.createAnalyser();
            analyserNode.fftSize = 256;

            // ต่อสายสัญญาณ
            scriptNode.connect(pannerNode);
            pannerNode.connect(analyserNode);
            analyserNode.connect(audioCtx.destination);

            isPlaying = true;
            ui.play.disabled = true;
            ui.pause.disabled = false;
            
            drawVisualizer();
        }

        function stopAudio() {
            if (scriptNode) {
                scriptNode.disconnect();
                pannerNode.disconnect();
                if(analyserNode) analyserNode.disconnect();
                scriptNode = null;
                pannerNode = null;
                analyserNode = null;
            }
            isPlaying = false;
            ui.play.disabled = false;
            ui.pause.disabled = true;
            cancelAnimationFrame(animationId);
        }

        // ระบบเลื่อนเวลาเพลง (Scrubbing)
        ui.progress.addEventListener('input', (e) => {
            if (audioBuffer) {
                const percent = parseFloat(e.target.value) / 100;
                globalPosition = Math.floor(percent * audioBuffer.length);
                ui.timeCurr.innerText = formatTime(globalPosition / audioCtx.sampleRate);
                if (soundTouch) soundTouch.clear(); // ล้างบัฟเฟอร์เดิมกันเสียงกระตุกตอนกระโดดข้ามเวลา
            }
        });

        // ควบคุมปุ่ม
        ui.play.addEventListener('click', playAudio);
        ui.pause.addEventListener('click', stopAudio);

        // ควบคุม Tempo & Pitch
        ui.tempo.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            ui.tempoVal.innerText = val.toFixed(2) + 'x';
            if (soundTouch) soundTouch.tempo = val;
        });

        ui.pitch.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            ui.pitchVal.innerText = val > 0 ? '+' + val : val;
            if (soundTouch) soundTouch.pitchSemis = val;
        });

        // จัดการ UI ปุ่มโหมด L/R
        function setMode(btn, panValue) {
            [ui.modeNormal, ui.modeLeft, ui.modeRight].forEach(b => {
                b.classList.remove('bg-cyan-600', 'text-white');
                b.classList.add('text-slate-400');
            });
            btn.classList.add('bg-cyan-600', 'text-white');
            btn.classList.remove('text-slate-400');
            if (pannerNode) pannerNode.pan.value = panValue;
        }

        ui.modeNormal.addEventListener('click', () => setMode(ui.modeNormal, 0));
        ui.modeLeft.addEventListener('click', () => setMode(ui.modeLeft, -1));
        ui.modeRight.addEventListener('click', () => setMode(ui.modeRight, 1));

        // ฟังก์ชันวาด Visualizer
        function drawVisualizer() {
            if (!analyserNode || !isPlaying) return;
            
            ui.canvas.width = ui.canvas.clientWidth;
            ui.canvas.height = ui.canvas.clientHeight;
            
            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            function draw() {
                if(!isPlaying) return;
                animationId = requestAnimationFrame(draw);
                analyserNode.getByteFrequencyData(dataArray);

                canvasCtx.fillStyle = '#0f172a'; // พื้นหลังสี slate-900
                canvasCtx.fillRect(0, 0, ui.canvas.width, ui.canvas.height);

                const barWidth = (ui.canvas.width / bufferLength) * 2.5;
                let barHeight;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    barHeight = dataArray[i] / 2;
                    canvasCtx.fillStyle = `rgb(34, 211, 238)`; // สี cyan-400
                    canvasCtx.fillRect(x, ui.canvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }
            }
            draw();
        }
    </script>
</body>
</html>
